<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên hệ hỗ trợ - MiniShop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-container">
      <a href="index.html" class="logo">MiniShop</a>
      <nav>
        <ul>
          <li><a href="index.html">Trang chủ</a></li>
          <li><a href="about.html">Giới thiệu</a></li>
          <li><a href="products.html">Sản phẩm</a></li>
          <li><a href="services.html">Dịch vụ</a></li>
          <li><a href="gallery.html">Bộ sưu tập</a></li>
          <li><a href="blog.html">Tin tức</a></li>
          <li><a href="contact.html" class="active">Liên hệ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="form-box">
      <h2 class="section-title">Gửi Yêu Cầu Hỗ Trợ</h2>
      <form action="#" method="get">
        <div class="form-group">
          <label for="name">Họ và tên:</label>
          <input type="text" id="name" name="name" placeholder="Nguyễn Văn A" required>
        </div>
        <div class="form-group">
          <label for="email">Địa chỉ Email:</label>
          <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
        </div>
        <div class="form-group">
          <label for="service">Nhu cầu liên hệ:</label>
          <select id="service" name="service">
            <option value="buy">Tư vấn mua thiết bị</option>
            <option value="fix">Bảo dưỡng, vệ sinh máy</option>
            <option value="mod">Custom phím / chuột</option>
          </select>
        </div>
        <div class="form-group">
          <label for="msg">Nội dung chi tiết:</label>
          <textarea id="msg" name="msg" rows="4" placeholder="Để lại lời nhắn cho MiniShop..." required></textarea>
        </div>
        <button type="submit" class="btn">Gửi thông tin</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 MiniShop Management System. Dự án bài tập Lập trình Web.</p>
  </footer>
</body>
</html>

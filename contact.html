<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên hệ - MiniShop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="header-container">
      <a href="index.html" class="logo">MiniShop</a>
      <nav>
        <ul>
          <li><a href="index.html">Trang chủ</a></li>
          <li><a href="products.html">Sản phẩm</a></li>
          <li><a href="contact.html" class="active">Liên hệ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div style="background: #fff; padding: 2rem; border-radius: 8px; border: 1px solid #e2e8f0; max-width: 600px; margin: auto;">
      <h2>Liên hệ hỗ trợ</h2>
      <p style="margin-bottom: 1rem; color: #64748b;">Điền thông tin vào mẫu dưới đây nếu bạn có thắc mắc hoặc cần tư vấn.</p>
      
      <form action="#" method="get">
        <div class="form-group">
          <label for="fullname">Họ và tên:</label>
          <input type="text" id="fullname" name="fullname" placeholder="Nhập tên của bạn" required>
        </div>
        <div class="form-group">
          <label for="email">Địa chỉ Email:</label>
          <input type="email" id="email" name="email" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
          <label for="message">Nội dung liên hệ:</label>
          <textarea id="message" name="message" rows="5" placeholder="Để lại lời nhắn..." required></textarea>
        </div>
        <button type="submit" class="btn">Gửi thông tin</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 MiniShop Management System. Dự án môn Lập trình Web.</p>
  </footer>

</body>
</html>
